    // --- localStorage-backed shim for the Claude-artifact `window.storage` API ---
    (function () {
      var PREFIX = "golf-aim:";
      function fullKey(key, shared) {
        return PREFIX + (shared ? "shared:" : "priv:") + key;
      }
      window.storage = {
        get: function (key, shared) {
          return new Promise(function (resolve, reject) {
            var k = fullKey(key, shared);
            if (!(k in localStorage)) { reject(new Error("Key not found: " + key)); return; }
            resolve({ key: key, value: localStorage.getItem(k), shared: !!shared });
          });
        },
        set: function (key, value, shared) {
          return new Promise(function (resolve) {
            localStorage.setItem(fullKey(key, shared), value);
            resolve({ key: key, value: value, shared: !!shared });
          });
        },
        delete: function (key, shared) {
          return new Promise(function (resolve) {
            var k = fullKey(key, shared);
            var existed = k in localStorage;
            localStorage.removeItem(k);
            resolve({ key: key, deleted: existed, shared: !!shared });
          });
        },
        list: function (prefix, shared) {
          return new Promise(function (resolve) {
            var tag = PREFIX + (shared ? "shared:" : "priv:");
            var keys = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf(tag) === 0) {
                var bare = k.slice(tag.length);
                if (!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
              }
            }
            resolve({ keys: keys, prefix: prefix, shared: !!shared });
          });
        }
      };
    })();
